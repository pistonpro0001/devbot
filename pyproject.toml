[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "devbot"
authors = [{name = "pistonpro0001", email = "piston.pro0001@gmail.com"}, {name = "roli2py", email = "romanmashevskyi@proton.me"}]
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version", "description"]
requires-python = "~=3.14.6"
dependencies = [
    "audioop-lts>=0.2.2 ; python_full_version >= '3.13'",
    "discord-py~=2.3.2",
    "python-dotenv~=1.0.0",
    "requests~=2.34.2",
]

[project.urls]
Home = "https://github.com/pistonpro0001/devbot"

[dependency-groups]
dev = [
    "prek~=0.4.13",
]
